<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- Dong Son Bronze Drum Motif -->
  <g transform="translate(100, 36) scale(0.7)">
    <circle cx="0" cy="0" r="26" stroke="#b45309" stroke-width="2" fill="#fffbeb" />
    <circle cx="0" cy="0" r="18" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" fill="none" />
    <circle cx="0" cy="0" r="8" fill="#b45309" />
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#fef3c7" />
  </g>
  <!-- Text -->
  <text x="100" y="70" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="800" letter-spacing="0.1em" fill="#b45309">TRỐNG ĐỒNG PALACE</text>
  <text x="100" y="80" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="600" letter-spacing="0.12em" fill="#92400e">CONVENTION CENTER</text>
</svg>
